org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official

# Runtime pins (tested-runtime-matrix.json is the record of what was verified with which).
# Override for a re-gate: ./gradlew ... -PlitertlmVersion=0.17.0 -PskipKotlinMetadataCheck=true
litertlmVersion=0.16.1
litertVersion=2.2.0
coroutinesVersion=1.11.0

# LiteRT 2.2.0: litert and litert-api both declare namespace com.google.ai.edge.litert, and AGP 9
# refuses duplicate library namespaces by default (measured 2026-09-07, AGP 9.3.1). Any app that
# depends on litert 2.2.0 under AGP 9 needs this until the AARs get distinct namespaces.
android.uniquePackageNames=false
