org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
# In-process Kotlin compilation: the daemon writes under ~/Library, which sandboxed builds cannot.
kotlin.compiler.execution.strategy=in-process
# The runtime with EmbeddingEngine and EmbeddingGemma 2 (released 2026-10-06); shown on screen as the runtime version.
litertlmVersion=0.18.0
